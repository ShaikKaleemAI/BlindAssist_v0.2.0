[versions]
agp = "8.5.2"
kotlin = "1.9.24"
coreKtx = "1.19.1"
appcompat = "1.7.0"
lifecycle = "2.8.4"
camerax = "1.3.4"
mediapipe = "0.10.14"
junit = "4.13.2"
tflite = "2.14.0"
mlkitText = "16.0.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }
tflite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tflite" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
